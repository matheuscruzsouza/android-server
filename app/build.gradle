plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace = 'com.github.matheuscruzsouza.androidserver'
    compileSdk = 36

    defaultConfig {
        applicationId = "com.github.matheuscruzsouza.androidserver"
        minSdk = 25
        targetSdk = 34
        versionCode = 2
        versionName = "2.0"

        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }
}

dependencies {
    implementation libs.activity.ktx
    implementation libs.appcompat
    implementation libs.constraintlayout
    implementation libs.material
    testImplementation libs.junit
    androidTestImplementation libs.espresso.core
    androidTestImplementation libs.ext.junit

    def room_version = "2.4.3"
    implementation "androidx.room:room-runtime:$room_version"
    annotationProcessor "androidx.room:room-compiler:$room_version"

    implementation 'com.github.matheuscruzsouza:nano-spring-core:2.4.0'
    implementation 'com.github.matheuscruzsouza:nano-spring-web:2.4.0'
    implementation 'com.github.matheuscruzsouza:nano-spring-data:2.4.0'
    implementation 'com.github.matheuscruzsouza:nano-spring-discovery:2.4.0'
}
