# Configuracoes do Nano-Spring
server.port=9090
nano.server.read-timeout=15000

# Configuracoes de Threads HTTP para Low-Memory e VPN/ZeroTier (evita fila travada por Keep-Alive/SSE)
nano.server.threads.core=12
nano.server.threads.max=24
nano.server.threads.queue-capacity=100

# Mensagens customizadas
app.welcome.message=Bem-vindo ao S4, configurado via application.properties!

# Configuracoes de Banco e Migracao do Nano-Spring 1.3.0
nano.datasource.name=androidserver.db
nano.datasource.wal.enabled=true
nano.datasource.migration.enabled=true
nano.datasource.migration.location=db/migration

# Configuracoes de Descoberta de Servico mDNS / Zeroconf (Nano-Spring 1.5.0+)
nano.nsd.enabled=true
nano.nsd.name=s4
nano.nsd.type=_http._tcp.
nano.nsd.host-resolution=true

# Configuracoes de CORS (Nano-Spring 1.6.0)
nano.cors.enabled=true
nano.cors.allowed-origins=*
nano.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
nano.cors.allowed-headers=Content-Type,Authorization,X-Requested-With,Accept
nano.cors.max-age=86400

# Configuracoes de Seguranca SSL / TLS (Nano-Spring 2.2.0)
server.ssl.enabled=false
server.ssl.key-store=keystore.p12
server.ssl.key-store-type=PKCS12
server.ssl.key-store-password=android
server.ssl.key-alias=s4-ssl
server.ssl.protocols=TLSv1.2

# Configuracoes de OpenAPI / Swagger (Nano-Spring 2.4.0)
nano.swagger.enabled=true
nano.swagger.title=S4 (Simple Shared Storage Service) - S3 & Storage API
nano.swagger.version=2.4.0
nano.swagger.description=API compatível com Amazon S3 e endpoints de gerenciamento de storage e IAM do servidor S4.
nano.swagger.security.enabled=true
nano.swagger.security.type=bearer
nano.swagger.security.name=Authorization
nano.swagger.security.scheme=bearer
nano.swagger.security.bearer-format=JWT / S3-AccessKey
nano.actuator.enabled=true
nano.actuator.secure=false

# Configuracoes de LocalTunnel (Exposicao Publica de Porta Local)
nano.localtunnel.enabled=false
nano.localtunnel.subdomain=s4-android


